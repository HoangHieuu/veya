<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vietnam Airlines · Flight search (mock)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a2f36;
        --muted: #6b8290;
        --teal: #006885;
        --gold: #c9a227;
        --line: #e4ecef;
        --surface: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 40% at 0% 0%, rgb(0 104 133 / 0.08), transparent 55%),
          linear-gradient(180deg, #f8fafb 0%, #eef3f5 100%);
      }
      .wrap {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgb(201 162 39 / 0.12);
        border: 1px solid rgb(201 162 39 / 0.35);
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a6d1a;
      }
      h1 {
        margin: 1rem 0 0.35rem;
        font-size: clamp(1.5rem, 4vw, 1.875rem);
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.55;
        color: var(--muted);
      }
      .card {
        margin-top: 1.75rem;
        padding: 1.25rem;
        border-radius: 1.25rem;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 8px 30px -16px rgb(0 104 133 / 0.2);
      }
      .card h2 {
        margin: 0 0 1rem;
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .grid {
        display: grid;
        gap: 0.75rem;
      }
      @media (min-width: 520px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      label {
        display: block;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        padding: 0.65rem 0.85rem;
        border-radius: 0.75rem;
        border: 1px solid var(--line);
        background: #f5f8f9;
        font: inherit;
        font-weight: 600;
        color: var(--teal);
      }
      .cta {
        display: block;
        width: 100%;
        margin-top: 1.25rem;
        padding: 0.875rem 1rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #007a98, #006885);
        color: #fff;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 700;
        cursor: not-allowed;
        opacity: 0.85;
      }
      .foot {
        margin-top: 1.25rem;
        padding: 0.875rem 1rem;
        border-radius: 0.875rem;
        background: rgb(0 104 133 / 0.05);
        border: 1px solid rgb(0 104 133 / 0.12);
        font-size: 0.8125rem;
        line-height: 1.5;
        color: var(--muted);
      }
      .foot strong {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <span class="badge">Veya handoff · prototype</span>
      <h1>Vietnam Airlines flight search</h1>
      <p class="lead">
        This mock tab shows the fields Veya would pre-fill on the official booking site.
      </p>

      <div class="card">
        <h2>Your search</h2>
        <div class="grid">
          <div>
            <label for="origin">From</label>
            <input id="origin" readonly />
          </div>
          <div>
            <label for="destination">To</label>
            <input id="destination" readonly />
          </div>
          <div>
            <label for="depart">Depart</label>
            <input id="depart" readonly />
          </div>
          <div>
            <label for="return">Return</label>
            <input id="return" readonly />
          </div>
          <div>
            <label for="adults">Adults</label>
            <input id="adults" readonly />
          </div>
        </div>
        <button type="button" class="cta" disabled>Search flights on VNA (mock)</button>
      </div>

      <p class="foot">
        <strong>Not a real booking.</strong> Fares, seats, and payment happen only on
        vietnamairlines.com. Close this tab to return to Veya.
      </p>
    </div>
    <script>
      const p = new URLSearchParams(location.search);
      const fmt = (iso) => {
        if (!iso) return "—";
        const d = new Date(iso + "T12:00:00");
        return d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
      };
      document.getElementById("origin").value = p.get("origin") || "—";
      document.getElementById("destination").value = p.get("destination") || "—";
      document.getElementById("depart").value = fmt(p.get("departDate"));
      document.getElementById("return").value = fmt(p.get("returnDate"));
      document.getElementById("adults").value = p.get("adults") || "1";
    </script>
  </body>
</html>
